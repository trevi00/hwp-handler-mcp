[project]
name = "hwp-handler-mcp"
version = "0.2.0"
description = "MCP server for Korean HWP/HWPX documents — read HWP 5.x and HWPX, edit and generate HWPX"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "trevi00", email = "rudtnrla20000@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "hwp", "hwpx", "korean", "hancom", "hangul", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "mcp[cli]>=1.27.0",
    "python-hwpx>=5.6,<6.0",
    "olefile>=0.47",
    "pydantic>=2.5",
    # 신뢰할 수 없는 문서의 XML을 파싱하므로 entity 확장 폭탄 방어가 필요하다.
    "defusedxml>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-defusedxml>=0.7",
]

[project.scripts]
hwp-handler-mcp = "hwp_handler_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/trevi00/hwp-handler-mcp"
Repository = "https://github.com/trevi00/hwp-handler-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwp_handler_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "RET", "SIM", "PT"]
ignore = ["S101"]   # pytest의 assert 허용

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # 테스트 비번 허용

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["olefile.*", "hwpx.*"]
ignore_missing_imports = true

# MCP SDK의 @mcp.tool() 데코레이터는 타입이 없어 감싸는 함수를 untyped로 만든다.
# 도구 정의 자체는 전부 타입이 붙어 있으므로 이 파일에서만 해당 코드를 끈다.
[[tool.mypy.overrides]]
module = ["hwp_handler_mcp.server"]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: real library calls (hwp-extract, python-hwpx)",
    "e2e: MCP stdio simulation",
]

[tool.uv]
package = true

# uv 는 이 그룹을 기본으로 설치한다. `uv run` 은 실행 전 기본 동기화를 하는데
# 그때 --all-extras 가 적용되지 않으므로, extra 에만 있는 패키지는 조용히
# 제거된다 (types-defusedxml 이 CI py3.12/3.13 에서 그렇게 사라졌다).
# 따라서 이 목록이 dev 의존성의 정본이고, 위 optional-dependencies 의 dev 는
# pip 사용자를 위한 동일 사본이다 — test_release_metadata 가 둘의 일치를 강제한다.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-defusedxml>=0.7",
]
