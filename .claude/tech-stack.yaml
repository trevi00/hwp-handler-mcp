stack:
  language: python
  framework: mcp
  version: "3.11"

# MCP Python SDK 기반 서버. HWP 파싱은 olefile + lxml 등 OSS 활용.
runtime:
  python_min: "3.11"
  package_manager: uv

dependencies:
  # 본 의존성 — 라이선스 안전(BSD/Apache/MIT) 위주
  runtime:
    - "mcp[cli]>=1.27.0,<2.0.0"   # MCP Python SDK (FastMCP 포함). caret 회피 위해 명시 핀
    - "python-hwpx>=2.9,<3.0"     # HWPX 전 영역 (airmang, Apache-2.0)
    - "hwp-extract>=0.1,<0.2"     # HWP5 + 사용자 비번 복호화 (Volexity, BSD-3) — 핵심
    - "hwplib-py>=1.0"            # HWP5 레코드 깊은 파싱 (라이선스 도입 전 확인 필요)
    - "olefile>=0.47"             # OLE2 저수준 fallback (BSD)
    - "lxml>=4.9"                 # XML 파싱 (명시화 — python-hwpx도 의존)

  # 분석/스펙 참고 전용 — 코드/의존으로 사용하지 않음
  spec_reference:
    - rhwp            # Rust 구현 (스펙 정오표·알고리즘 참고만)

  # 회피 라이브러리 — 명시
  avoided:
    - pyhwp           # AGPLv3+ : MCP 서비스 배포 시 소스 공개 의무 위험
    - pyhwpx          # pywin32 COM + 한컴오피스 설치 의존, 크로스플랫폼 X
    - hwp-parser      # 내부적으로 pyhwp(AGPL) 의존 → 라이선스 전파

format_scope:
  - hwp5             # 한글 2002+ OLE2
  - hwpx             # 한글 2010+ OWPML/ZIP
  - hwp3             # 한글 97/98 (구형, 후순위)

drm_policy:
  encrypted_documents: user_password_only   # 사용자가 입력한 비번으로만 복호화 시도
  bypass: forbidden                          # DRM 우회 절대 안 함

# (선택) 프로젝트 전용 추가 스킬 트리 — 현재는 없음
# extensions: []
