name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows를 뺄 수 없다. 주 사용자가 한글 문서를 쓰는 Windows 사용자이고,
        # cp949 콘솔에서만 나는 인코딩 결함이 실제로 존재한다.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      # 잡 전체에 고정한다. `--python` 을 sync 에만 주면 이후 `uv run` 이
      # 프로젝트 기본 인터프리터로 venv 를 다시 만들어, 매트릭스가 실제로는
      # 한 버전만 시험하게 된다 (실측으로 확인한 함정).
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Confirm interpreter version
        run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python }}'), sys.version; print(sys.version)"

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

  mcp-sdk-1x:
    name: MCP SDK 1.x compatibility
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      # 호환 레이어가 두 메이저 모두에서 도는지 확인한다. 한쪽만 돌리면
      # _compat.py 의 나머지 가지는 검증되지 않은 추측으로 남는다.
      - name: Test against MCP SDK 1.x
        run: uv run --with "mcp[cli]==1.29.0" pytest -q

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Verify metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
